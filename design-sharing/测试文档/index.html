<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --bg: #08131f;
        --panel: rgba(7, 17, 28, 0.72);
        --panel-strong: rgba(12, 26, 40, 0.9);
        --text: #edf4ff;
        --muted: #96aeca;
        --accent: #72f0d0;
        --accent-2: #ff9d7a;
        --accent-3: #9bb8ff;
        --line: rgba(255, 255, 255, 0.08);
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(114, 240, 208, 0.15), transparent 28%),
          radial-gradient(circle at 85% 20%, rgba(155, 184, 255, 0.2), transparent 26%),
          radial-gradient(circle at bottom right, rgba(255, 157, 122, 0.15), transparent 24%),
          linear-gradient(135deg, #09131d 0%, #06101b 45%, #0d1826 100%);
        color: var(--text);
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(circle at center, black 48%, transparent 92%);
        pointer-events: none;
      }

      button {
        font: inherit;
      }

      .deck {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .slide-shell {
        position: absolute;
        inset: 0;
        padding: 28px;
      }

      .slide {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 46px 54px 34px;
        border: 1px solid var(--line);
        border-radius: 30px;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)),
          rgba(6, 15, 24, 0.72);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .slide::before,
      .slide::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        filter: blur(12px);
        opacity: 0.75;
        pointer-events: none;
      }

      .slide::before {
        width: 220px;
        height: 220px;
        top: -90px;
        right: -30px;
        background: radial-gradient(circle, rgba(114, 240, 208, 0.22), transparent 68%);
      }

      .slide::after {
        width: 260px;
        height: 260px;
        bottom: -110px;
        left: -60px;
        background: radial-gradient(circle, rgba(155, 184, 255, 0.16), transparent 70%);
      }

      .slide-enter {
        animation: slide-in 480ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.985);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
      }

      .eyebrow {
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .page-tag {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 10px 16px;
        color: var(--muted);
        font-size: 0.95rem;
        background: rgba(255, 255, 255, 0.03);
      }

      .content {
        position: relative;
        z-index: 1;
        display: grid;
        align-content: center;
        gap: 22px;
        min-height: 0;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 28px;
        align-items: center;
      }

      .hero-text {
        display: grid;
        gap: 18px;
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      h1 {
        font-size: clamp(2.8rem, 5vw, 5.7rem);
        max-width: 10ch;
      }

      h2 {
        font-size: clamp(2.3rem, 4vw, 4.2rem);
        max-width: 14ch;
      }

      .subtitle {
        max-width: 70ch;
        font-size: clamp(1rem, 1.5vw, 1.2rem);
        line-height: 1.8;
        color: #d6e4f7;
      }

      .pill-row,
      .stat-row,
      .footer-hint {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .meta-card,
      .pill,
      .stat,
      .quote,
      .panel,
      .list-card {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: var(--panel);
        border-radius: 22px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .meta-card,
      .pill,
      .stat {
        padding: 14px 18px;
      }

      .meta-card {
        min-width: 180px;
      }

      .meta-label,
      .stat-label {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .meta-value,
      .stat-value {
        margin-top: 6px;
        font-size: 1.05rem;
      }

      .visual {
        min-height: 320px;
        border-radius: 28px;
        background:
          radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.2), transparent 18%),
          linear-gradient(160deg, rgba(114, 240, 208, 0.08), rgba(155, 184, 255, 0.08)),
          rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
      }

      .face {
        position: absolute;
        inset: 12% 18%;
        border-radius: 36% 36% 42% 42%;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.22), transparent 25%),
          linear-gradient(180deg, rgba(199, 236, 255, 0.16), rgba(114, 240, 208, 0.07));
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .eye {
        position: absolute;
        width: 18%;
        height: 18%;
        top: 37%;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #daf7ff 0 18%, #061018 19% 56%, #0c1f31 57% 100%);
        box-shadow:
          0 0 0 10px rgba(255, 255, 255, 0.04),
          0 8px 30px rgba(114, 240, 208, 0.18);
        animation: eye-drift 8s ease-in-out infinite;
      }

      .eye.left {
        left: 24%;
      }

      .eye.right {
        right: 24%;
        animation-delay: 0.4s;
      }

      .mouth {
        position: absolute;
        left: 50%;
        bottom: 23%;
        width: 28%;
        height: 14%;
        transform: translateX(-50%);
        border-bottom: 5px solid rgba(255, 157, 122, 0.88);
        border-radius: 0 0 999px 999px;
        filter: drop-shadow(0 8px 18px rgba(255, 157, 122, 0.2));
        animation: mouth-shift 7s ease-in-out infinite;
      }

      .tear {
        position: absolute;
        right: 22%;
        top: 56%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 157, 122, 0.95);
        box-shadow: 0 0 18px rgba(255, 157, 122, 0.3);
      }

      @keyframes eye-drift {
        0%,
        100% {
          transform: translate(0, 0);
        }

        30% {
          transform: translate(4px, -2px);
        }

        60% {
          transform: translate(-5px, 3px);
        }
      }

      @keyframes mouth-shift {
        0%,
        100% {
          border-bottom-left-radius: 999px;
          border-bottom-right-radius: 999px;
          transform: translateX(-50%) scaleX(1);
        }

        40% {
          transform: translateX(-50%) scaleX(0.92) translateY(-2px);
        }

        70% {
          transform: translateX(-50%) scaleX(1.08);
        }
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .list-card,
      .panel {
        padding: 22px 24px;

        font-size: 1.05rem;
        color: #f4f8ff;
      }

        display: grid;
        gap: 12px;
        color: #dbe9fb;
        line-height: 1.75;

        color: #eef5ff;

        align-items: stretch;

      .timeline {

      }

      .timeline-body {
        line-height: 1.7;
        color: #dbe7f8;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .progress {
        position: relative;
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .progress-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: inherit;
      }

      .footer-hint {
        color: var(--muted);
        font-size: 0.92rem;
        align-items: center;
      }

      .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #f5f9ff;
      }

      .nav-layer {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        z-index: 3;
      }

      .nav-hit {
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .nav-hit:focus-visible {
        outline: 2px solid rgba(114, 240, 208, 0.65);
        outline-offset: -8px;
      }

      .controls {
        position: absolute;
        right: 38px;
        bottom: 38px;
        z-index: 4;
        display: flex;
        gap: 10px;
      }

      .control-btn {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(9, 18, 30, 0.8);
        color: #f5f8ff;
        cursor: pointer;
      }

      .control-btn:hover {
        background: rgba(18, 34, 52, 0.95);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(114, 240, 208, 0.08);
        border: 1px solid rgba(114, 240, 208, 0.16);
        color: #dffbf5;
        width: fit-content;
      }

      .large-number {
        font-size: clamp(2.4rem, 5vw, 4.8rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .closing {
        display: grid;
        place-items: center;
        text-align: center;
      }

      .closing h1 {
        max-width: none;
      }

      .closing p {
        margin: 0;
        font-size: 1.08rem;
        color: var(--muted);
        letter-spacing: 0.14em;
      }

      @media (max-width: 900px) {
        .slide-shell {
          padding: 14px;
        }

        .slide {
          padding: 28px 22px 24px;
          border-radius: 22px;
        }

        .hero,
        .split,
        .grid {
          grid-template-columns: 1fr;
        }

        .visual {
          min-height: 240px;
        }

        .footer {
          flex-direction: column;
          align-items: stretch;
        }

        .controls {
          right: 22px;
          bottom: 22px;
        }

        .topbar {
          align-items: center;
        }

        h1 {
          max-width: 100%;
        }
      }
    </style>
  </head>

      function indexFromHash() {
        const raw = window.location.hash.replace("#slide-", "");
        const parsed = Number.parseInt(raw, 10);
        if (Number.isNaN(parsed) || parsed < 1 || parsed > slides.length) {
          return 0;
        }
        return parsed - 1;
      }

      function footer(progress) {
        return `
          <div class="footer">
            <div class="progress">
              <div class="progress-bar" style="width:${progress}%"></div>
            </div>
            <div class="footer-hint">
              <span>点击左右半屏翻页</span>
              <span class="key">←</span>
              <span class="key">→</span>
            </div>
          </div>
        `;
      }

      function topbar(slide, index) {
        return `
          <div class="topbar">
            <div class="eyebrow">${slide.eyebrow || ""}</div>
            <div class="page-tag">${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</div>
          </div>
        `;
      }

      function renderCover(slide, progress, index) {
        const meta = slide.meta
          .map(
            ([label, value]) => `
              <div class="meta-card">
                <div class="meta-label">${label}</div>
                <div class="meta-value">${value}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content hero">
            <div class="hero-text">
              <div class="badge">主题分享 / Presentation</div>
              <h1>${slide.title}</h1>
              <div class="subtitle">${slide.subtitle}</div>
              <div class="meta-row">${meta}</div>
            </div>
            <div class="visual" aria-hidden="true">
              <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
                <div class="tear"></div>
              </div>
            </div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderHeroFace(slide, progress, index) {
        const pills = slide.pills.map((item) => `<div class="pill">${item}</div>`).join("");
        return `
          ${topbar(slide, index)}
          <div class="content hero">
            <div class="hero-text">
              <h2>${slide.title}</h2>
              <div class="subtitle">${slide.subtitle}</div>
              <div class="pill-row">${pills}</div>
            </div>
            <div class="visual" aria-hidden="true">
              <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
                <div class="tear"></div>
              </div>
            </div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderProfile(slide, progress, index) {
        const stats = slide.stats
          .map(
            ([label, value]) => `
              <div class="stat">
                <div class="stat-label">${label}</div>
                <div class="stat-value">${value}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            <div class="subtitle">${slide.subtitle}</div>
            <div class="stat-row">${stats}</div>
            <div class="quote"><span>${slide.quote}</span></div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderSplitList(slide, progress, index) {
        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            <div class="split">
              <div class="list-card">
                <h3>${slide.leftTitle}</h3>
                <ul>${slide.leftList.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
              <div class="list-card">
                <h3>${slide.rightTitle}</h3>
                <ul>${slide.rightList.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
            </div>
            ${slide.quote ? `<div class="quote"><span>${slide.quote}</span></div>` : ""}
          </div>
          ${footer(progress)}
        `;
      }

      function renderIndustry(slide, progress, index) {
        const stats = slide.stats
          .map(
            ([label, value]) => `
              <div class="stat">
                <div class="stat-label">${label}</div>
                <div class="stat-value">${value}</div>
              </div>
            `
          )
          .join("");

        const companies = slide.companies
          .map(
            ([name, desc]) => `
              <div class="timeline-item">
                <div class="timeline-title">${name}</div>
                <div class="timeline-body">${desc}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            <div class="stat-row">${stats}</div>
            <div class="split">
              <div class="panel">
                <h3>主流发展路径</h3>
                <div class="subtitle">让机器人具备真实人类的工作能力，例如行走、抓取、搬运，重点强调“能干活”。</div>
              </div>
              <div class="panel">
                <h3>代表公司</h3>
                <div class="timeline">${companies}</div>
              </div>
            </div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderCompare(slide, progress, index) {
        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            <div class="grid">
              <div class="panel">
                <h3>${slide.leftTitle}</h3>
                <ul>${slide.leftList.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
              <div class="panel">
                <h3>${slide.rightTitle}</h3>
                <ul>${slide.rightList.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
            </div>
            <div class="quote"><span>${slide.quote}</span></div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderFramework(slide, progress, index) {
        const items = slide.steps
          .map(
            ([num, text]) => `
              <div class="timeline-item">
                <div class="timeline-title">${num}</div>
                <div class="timeline-body">${text}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content">
            <div class="badge">本次分享的分析路径</div>
            <h2>${slide.title}</h2>
            <div class="timeline">${items}</div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderTimeline(slide, progress, index) {
        const items = slide.timeline
          .map(
            ([label, text]) => `
              <div class="timeline-item">
                <div class="timeline-title">${label}</div>
                <div class="timeline-body">${text}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            ${slide.subtitle ? `<div class="subtitle">${slide.subtitle}</div>` : ""}
            <div class="timeline">${items}</div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderApplications(slide, progress, index) {
        const cards = slide.items
          .map(
            ([title, desc]) => `
              <div class="list-card">
                <h3>${title}</h3>
                <div class="subtitle">${desc}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            <div class="grid">${cards}</div>
            <div class="quote"><span>${slide.quote}</span></div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderValueShift(slide, progress, index) {
        return `
          ${topbar(slide, index)}
          <div class="content">
            <h2>${slide.title}</h2>
            <div class="split">
              <div class="panel">
                <h3>${slide.leftTitle}</h3>
                <ul>${slide.leftList.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
              <div class="panel">
                <h3>${slide.rightTitle}</h3>
                <ul>${slide.rightList.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
            </div>
            <div class="quote"><span>${slide.quote}</span></div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderThoughts(slide, progress, index) {
        const items = slide.timeline
          .map(
            ([label, text]) => `
              <div class="timeline-item">
                <div class="timeline-title">${label}</div>
                <div class="timeline-body">${text}</div>
              </div>
            `
          )
          .join("");

        return `
          ${topbar(slide, index)}
          <div class="content">
            <div class="badge">从产品体验出发的判断</div>
            <h2>${slide.title}</h2>
            <div class="timeline">${items}</div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderClosing(slide, progress, index) {
        return `
          ${topbar(slide, index)}
          <div class="content closing">
            <div>
              <div class="eyebrow">AheadForm / Emotion-Centered Robotics</div>
              <h1>${slide.title}</h1>
              <div class="subtitle">${slide.subtitle}</div>
            </div>
          </div>
          ${footer(progress)}
        `;
      }

      function renderSlide(index) {
        const slide = slides[index];
        const progress = ((index + 1) / slides.length) * 100;
        const renderers = {
          cover: renderCover,
          "hero-face": renderHeroFace,
          profile: renderProfile,
          "split-list": renderSplitList,
          industry: renderIndustry,
          compare: renderCompare,
          framework: renderFramework,
          timeline: renderTimeline,
          applications: renderApplications,
          "value-shift": renderValueShift,
          thoughts: renderThoughts,
          closing: renderClosing,
        };

        slideEl.classList.remove("slide-enter");
        void slideEl.offsetWidth;
        slideEl.innerHTML = renderers[slide.type](slide, progress, index);
        slideEl.classList.add("slide-enter");
      }

      function syncHash(index) {
        const nextHash = `#slide-${index + 1}`;
        if (window.location.hash !== nextHash) {
          history.replaceState(null, "", nextHash);
        }
      }

      function goTo(index, options = {}) {
        currentIndex = (index + slides.length) % slides.length;
        renderSlide(currentIndex);
        if (!options.skipHash) {
          syncHash(currentIndex);
        }
      }

      function next() {
        goTo(currentIndex + 1);
      }

      function prev() {
        goTo(currentIndex - 1);
      }

      nextBtn.addEventListener("click", next);
      prevBtn.addEventListener("click", prev);
      nextHit.addEventListener("click", next);
      prevHit.addEventListener("click", prev);

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          next();
        }

        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          prev();
        }

        if (event.key === "Home") {
          goTo(0);
        }

        if (event.key === "End") {
          goTo(slides.length - 1);
        }
      });

      window.addEventListener("hashchange", () => {
        goTo(indexFromHash(), { skipHash: true });
      });

      currentIndex = indexFromHash();
      renderSlide(currentIndex);
      syncHash(currentIndex);
    </script>
  </body>
</html>
